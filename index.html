<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15132b">
<title>Komitmen Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom ala aplikasi HP (maks 560px), stiker bergaris tebal dan bayangan offset, satu level per layar. */
:root{
  --bg:#f6f4ff; --paper:#ffffff; --ink:#15132b; --ink-2:#4b4868; --line:#15132b;
  --lime:#c6f432; --coral:#ff6b5b; --sky:#5bc8ff; --sun:#ffd23f; --lilac:#b9a7ff;
  --good:#1fa463; --bad:#e2412f; --soft:#ece9ff;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:18px; --sh:4px 4px 0 var(--line);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121026; --paper:#1d1a3a; --ink:#f3f1ff; --ink-2:#bdb8e3; --line:#0a0918; --soft:#2a2652; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121026; --paper:#1d1a3a; --ink:#f3f1ff; --ink-2:#bdb8e3; --line:#0a0918; --soft:#2a2652; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:16px/1.5 var(--body); margin:0;
  background-image:radial-gradient(var(--soft) 1.2px, transparent 1.2px); background-size:22px 22px;}
.app{max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:12px 28px}
h1,h2,h3{font-family:var(--display); line-height:1.08; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit}
.muted{color:var(--ink-2)}
.tiny{font-size:.8rem}

/* top bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:10px;
  padding:10px 0; background:var(--bg)}
.brand{font:800 1rem var(--display); letter-spacing:.02em; display:flex; align-items:center; gap:6px; white-space:nowrap}
.brand i{display:inline-block; width:22px; height:22px; border-radius:7px; background:var(--lime); border:2px solid var(--line); box-shadow:2px 2px 0 var(--line)}
.xpbox{flex:1; min-width:0}
.xptrack{height:12px; border:2px solid var(--line); border-radius:99px; background:var(--paper); overflow:hidden}
.xpfill{height:100%; width:0; background:linear-gradient(90deg,var(--lime),var(--sun)); transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.xpmeta{display:flex; justify-content:space-between; font:800 .72rem var(--mono); margin-top:3px}
.iconbtn{width:40px; height:40px; border-radius:12px; border:2px solid var(--line); background:var(--paper); box-shadow:2px 2px 0 var(--line); cursor:pointer; display:grid; place-items:center; flex:none}
.iconbtn svg{width:20px; height:20px}

/* level dots */
.levels{display:flex; gap:6px; margin:4px 0 14px}
.levels span{flex:1; height:8px; border-radius:99px; background:var(--soft); border:2px solid var(--line)}
.levels span.done{background:var(--good)} .levels span.now{background:var(--sun)}

/* cards & buttons */
.card{background:var(--paper); border:2.5px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); padding:20px}
.stack{display:flex; flex-direction:column; gap:14px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:12px 20px;
  border:2.5px solid var(--line); border-radius:14px; background:var(--lime); color:#15132b; font:800 1.02rem var(--display);
  box-shadow:var(--sh); cursor:pointer; transition:transform .08s, box-shadow .08s; text-align:center}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn.alt{background:var(--paper); color:var(--ink)}
.btn.block{width:100%}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
.eyebrow{font:800 .74rem var(--mono); letter-spacing:.12em; text-transform:uppercase}
.tag{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:2px solid var(--line); border-radius:99px; font:800 .74rem var(--mono); background:var(--sun); color:#15132b; letter-spacing:.06em}

/* home */
.hero{position:relative; overflow:hidden; background:#15132b; color:#fff; border-color:#000}
.hero h1{font-size:clamp(2.6rem,11vw,3.6rem); font-weight:800; line-height:.92}
.hero h1 em{font-style:normal; color:var(--lime)}
.hero p{color:#d9d6f5}
.sticker{position:absolute; border:2.5px solid #000; border-radius:14px; font:800 .8rem var(--display); padding:6px 10px; color:#15132b; box-shadow:3px 3px 0 #000}
.map{display:grid; gap:10px}
.mapitem{display:flex; gap:12px; align-items:center; padding:12px; border:2px solid var(--line); border-radius:14px; background:var(--paper)}
.mapitem b{font-family:var(--display)}
.mapnum{width:38px; height:38px; flex:none; display:grid; place-items:center; border:2px solid var(--line); border-radius:11px; font:800 1rem var(--mono); color:#15132b}
.field{display:flex; flex-direction:column; gap:6px; font-weight:700}
.input{width:100%; min-height:52px; padding:12px 14px; border:2.5px solid var(--line); border-radius:14px; background:var(--paper); color:var(--ink); font:600 1.05rem var(--body)}
.input:focus{outline:3px solid var(--sky); outline-offset:2px}
textarea.input{min-height:90px; resize:vertical}

/* level intro */
.lvlhead{display:flex; flex-direction:column; gap:8px}
.lvlhead h2{font-size:clamp(1.8rem,7vw,2.3rem)}
.goal{font-size:.92rem; padding:10px 12px; border-radius:12px; background:var(--soft); border:2px dashed var(--line)}

/* options */
.q{font:700 1.25rem/1.25 var(--display)}
.opts{display:grid; gap:10px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; min-height:56px; padding:12px 14px;
  border:2.5px solid var(--line); border-radius:14px; background:var(--paper); cursor:pointer; box-shadow:3px 3px 0 var(--line); font-weight:600}
.opt .k{width:30px; height:30px; flex:none; border-radius:9px; border:2px solid var(--line); display:grid; place-items:center; font:800 .85rem var(--mono); background:var(--soft)}
.opt.ok{background:#d6f7e5; color:#0f3d26} .opt.ok .k{background:var(--good); color:#fff}
.opt.no{background:#ffe0dc; color:#5a1209} .opt.no .k{background:var(--bad); color:#fff}
.opt[disabled]{cursor:default}
.progress-dots{display:flex; gap:5px; flex-wrap:wrap}
.progress-dots i{width:22px; height:6px; border-radius:99px; background:var(--soft); border:1.5px solid var(--line)}
.progress-dots i.on{background:var(--ink)}

/* feedback toast */
.fb{border:2.5px solid var(--line); border-radius:14px; padding:12px 14px; font-size:.95rem; box-shadow:3px 3px 0 var(--line)}
.fb.good{background:#d6f7e5; color:#0f3d26} .fb.bad{background:#ffe9c7; color:#5a3a00}
.fb b{font-family:var(--display)}

/* archetype result */
.arch{color:#15132b}
.arch h2{font-size:2.2rem}
.arch .pill{align-self:flex-start; display:inline-block; background:#ffffffb0; border:2px solid #15132b; border-radius:99px; padding:3px 10px; font:800 .75rem var(--mono)}
.arch dl{display:grid; gap:10px; margin:0}
.arch dt{font:800 .74rem var(--mono); letter-spacing:.1em; text-transform:uppercase}
.arch dd{margin:2px 0 0}
.bars{display:grid; gap:6px}
.barrow{display:grid; grid-template-columns:96px 1fr 26px; gap:8px; align-items:center; font-size:.82rem; font-weight:700}
.barrow div{height:12px; border:2px solid var(--line); border-radius:99px; background:var(--paper); overflow:hidden}
.barrow div i{display:block; height:100%}

/* johari */
.jgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.jq{min-height:92px; padding:10px; border:2.5px solid var(--line); border-radius:14px; text-align:left; cursor:pointer; background:var(--paper); box-shadow:3px 3px 0 var(--line); display:flex; flex-direction:column; gap:2px}
.jq b{font-family:var(--display); font-size:1.02rem} .jq small{color:var(--ink-2); font-size:.78rem; line-height:1.3}
.jq.ok{background:#d6f7e5; color:#0f3d26} .jq.no{background:#ffe0dc; color:#5a1209}
.jq.ok small,.jq.no small{color:inherit}
.jaxis{display:flex; justify-content:space-between; font:800 .66rem var(--mono); color:var(--ink-2); letter-spacing:.06em}
.scenario{font:700 1.12rem/1.35 var(--display); background:var(--sun); color:#15132b; border:2.5px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--sh)}

/* swipe */
.deck{position:relative; height:340px; touch-action:pan-y}
.swipe{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; gap:12px; padding:22px;
  border:2.5px solid var(--line); border-radius:22px; background:var(--paper); box-shadow:6px 6px 0 var(--line); user-select:none; cursor:grab; touch-action:none}
.swipe.behind{transform:scale(.95) translateY(12px); filter:brightness(.97); box-shadow:3px 3px 0 var(--line)}
.swipe .txt{font:800 1.5rem/1.2 var(--display)}
.stamp{position:absolute; top:64px; padding:4px 12px; border:3px solid; border-radius:10px; font:800 1.1rem var(--mono); opacity:0; transform:rotate(-12deg)}
.stamp.g{left:20px; color:var(--good)} .stamp.r{right:20px; color:var(--bad); transform:rotate(12deg)}
.swipebtns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn.red{background:var(--coral)} .btn.green{background:var(--lime)}

/* tuckman */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:46px; padding:10px 14px; border:2.5px solid var(--line); border-radius:99px; background:var(--paper); cursor:pointer; font-weight:700; box-shadow:2px 2px 0 var(--line)}
.chip.on{background:var(--ink); color:var(--bg)}
.chip.done{background:var(--good); color:#fff; cursor:default}
.slots{display:grid; gap:8px}
.slot{display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 12px; border:2.5px dashed var(--line); border-radius:14px; font-weight:700}
.slot.filled{border-style:solid; background:var(--paper)}
.slot .n{font:800 .9rem var(--mono); width:26px}
.slot small{display:block; font-weight:500; color:var(--ink-2); font-size:.8rem}

/* commitment */
.normchips .chip.on{background:var(--lime); color:#15132b}
.cardimg{width:100%; border:2.5px solid var(--line); border-radius:18px; box-shadow:var(--sh); display:block}
.badges{display:flex; flex-wrap:wrap; gap:8px}
.badge{display:flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border:2px solid var(--line); border-radius:99px; background:var(--paper); font-weight:700; font-size:.88rem}
.badge i{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-style:normal}
.badge.locked{opacity:.4}

/* facilitator */
.guide h3{font-size:1.15rem; margin-top:4px}
.guide ol,.guide ul{margin:6px 0 0; padding-left:20px; display:grid; gap:6px}
.time{font:800 .78rem var(--mono); background:var(--sky); color:#15132b; border:2px solid var(--line); border-radius:8px; padding:1px 7px}

/* animation */
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.92); opacity:.2}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.floatxp{position:fixed; z-index:30; font:800 1.3rem var(--mono); color:#15132b; background:var(--lime); border:2.5px solid #15132b; border-radius:12px; padding:2px 10px; pointer-events:none; animation:up 1s forwards}
@keyframes up{to{transform:translateY(-70px); opacity:0}}
canvas.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}

/* ---- papan fasilitator ---- */
body.wide .app{max-width:1400px}
body.wide .foot{color:#bdb8e3}
body.wide{background:#15132b; background-image:radial-gradient(#2a2652 1.2px, transparent 1.2px)}
.board{color:#fff; display:flex; flex-direction:column; gap:16px}
.bhead{display:flex; gap:16px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.btitle{min-width:0; flex:1 1 300px} .btitle h1{font-size:clamp(1.6rem,3.4vw,2.6rem)}
.bjoin{display:flex; gap:14px; align-items:center; background:#fff; color:#15132b; border:3px solid #000; border-radius:18px; padding:12px 14px; box-shadow:5px 5px 0 #000}
.bjoin small{display:block; font:800 .66rem var(--mono); letter-spacing:.1em; text-transform:uppercase; color:#4b4868}
.bjoin .burl{display:block; font:700 .9rem var(--body); word-break:break-all; max-width:260px; margin-bottom:4px}
.bjoin .bcode{display:block; font:800 2.4rem/1 var(--mono); letter-spacing:.12em}
.qr{width:132px; height:132px; flex:none} .qr svg{width:132px; height:132px; display:block}
.bgrid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start}
.cloudwrap{background:#1d1a3a; border:3px solid #000; border-radius:22px; box-shadow:6px 6px 0 #000; padding:20px; min-height:420px; display:flex; flex-direction:column}
.cloud{flex:1; display:flex; padding:10px 0; flex-wrap:wrap; justify-content:center; align-content:center; align-items:center; gap:6px 22px; min-height:360px; text-align:center}
.word{font-family:var(--display); line-height:1.05; transition:font-size .6s cubic-bezier(.3,1.4,.5,1), color .4s; letter-spacing:-.01em; cursor:default}
body.wide .word:hover{text-decoration:underline}
.cloud-empty{color:#bdb8e3; font:700 1.2rem var(--display); text-align:center} .cloud-empty small{font:500 .95rem var(--body)}
.bstat{font:700 .9rem var(--mono); color:#bdb8e3; text-align:center; margin-top:10px}
.bstat span#bTotal{color:var(--lime); font-size:1.2rem}
.bside{display:flex; flex-direction:column; gap:14px; min-width:0}
.bpanel{background:#1d1a3a; border:3px solid #000; border-radius:18px; box-shadow:5px 5px 0 #000; padding:16px; display:flex; flex-direction:column; gap:10px}
.bpanel h3{font-size:1.05rem}
.bpanel .barrow{color:#fff} .bpanel .barrow div{background:#15132b; border-color:#000}
.top3{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.top3 li{display:flex; gap:10px; align-items:flex-start}
.t3n{width:32px; height:32px; flex:none; display:grid; place-items:center; border:2px solid #000; border-radius:10px; font:800 1rem var(--mono); color:#15132b}
.t3b{flex:1; min-width:0} .t3b b{font-family:var(--display); display:block; line-height:1.2}
.t3b small{color:#bdb8e3}
.t3bar{height:10px; background:#15132b; border:2px solid #000; border-radius:99px; overflow:hidden; margin:5px 0 3px} .t3bar i{display:block; height:100%; transition:width .6s}
.proms{list-style:none; margin:0; padding:0; display:grid; gap:8px; max-height:300px; overflow:auto; font-size:.9rem}
.proms li{background:#15132b; border-radius:10px; padding:8px 10px}
.bctl{display:flex; flex-wrap:wrap; gap:8px}
.bctl .btn{min-height:44px; padding:8px 14px; font-size:.9rem; box-shadow:3px 3px 0 #000; border-color:#000}
body.wide .bctl .btn.alt{background:#1d1a3a; color:#fff}
@media (max-width:900px){ .bgrid{grid-template-columns:1fr} .bjoin .bcode{font-size:1.8rem} }
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row > *{flex:1 1 140px}
.center{text-align:center}
.foot{margin-top:auto; padding-top:24px; text-align:center; font-size:.76rem; color:var(--ink-2)}
</style>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>window.qrcode || document.write('<script src="vendor/qrcode-generator-1.4.4.js"><\/script>')</script>

<div class="app">

    <button class="brand" id="brandHome" type="button" title="Kembali ke beranda (progres tetap tersimpan)" style="background:none; border:0; padding:0; cursor:pointer"><i></i>KQ</button>
    <div class="xpbox"><div class="xptrack"><div class="xpfill" id="xpfill"></div></div>
      <div class="xpmeta"><span id="xpnum">0 XP</span><span id="combo"></span></div></div>
    <button class="iconbtn" id="soundBtn" aria-label="Suara">🔊</button>
  </header>
  <div class="levels" id="lvldots" hidden></div>
  <main id="screen" class="stack" aria-live="polite"></main>
  <p class="foot">Pusat Pelatihan Sumber Daya Manusia Arsip Nasional Republik Indonesia · Mata Pelatihan Building Learning Commitment</p>
</div>

<script>

  {q:"Yang paling bikin kamu bete di kelas…", a:[
    ["Materi monoton tanpa variasi","penjelajah"],["Suasana tegang atau ada yang dicuekin","perekat"],

  {q:"Peran favoritmu di tim…", a:[
    ["Tukang ide","penjelajah"],["Penjaga suasana","perekat"],["Pencatat dan penyusun","perancang"],["Penggerak dan penentu","penggerak"]]},
];
const JOHARI = {
  arena:{name:"Arena (Terbuka)", hint:"Aku tahu · orang lain tahu"},
  blind:{name:"Blind Spot", hint:"Aku tidak tahu · orang lain tahu"},
  hidden:{name:"Tersembunyi", hint:"Aku tahu · orang lain tidak tahu"},
  unknown:{name:"Belum Diketahui", hint:"Aku tidak tahu · orang lain tidak tahu"},
};
const JOHARI_ITEMS = [
  ["Kamu tahu kamu jago presentasi, dan teman sekelas juga melihatnya.","arena"],
  ["Teman bilang kamu sering memotong pembicaraan. Kamu sendiri tidak sadar.","blind"],
  ["Sebenarnya kamu grogi bicara di depan kelas, tapi tidak ada yang tahu.","hidden"],

const CFG = window.KQ_CONFIG || {};
const ONLINE = Boolean(CFG.SUPABASE_URL && CFG.SUPABASE_KEY && !/xxxx|ISI_/.test(CFG.SUPABASE_URL + CFG.SUPABASE_KEY));
async function api(fn, args){
  if (!ONLINE) throw new Error("Papan kelas belum diaktifkan (config.js belum diisi).");
  const key = CFG.SUPABASE_KEY.trim();
  const headers = {"Content-Type":"application/json", apikey:key};
  if (key.startsWith("eyJ")) headers.Authorization = "Bearer " + key;
  let res;
  try { res = await fetch(CFG.SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, {method:"POST", headers, body:JSON.stringify(args)}); }
  catch(e) { throw new Error("Koneksi internet bermasalah. Coba lagi."); }
  const txt = await res.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e) {}
  if (!res.ok) throw new Error((data && (data.message || data.hint)) || `Server menolak (${res.status})`);
  return data;
}
function clientId(){
  const K = "komitmen-quest:client"; let id = null;
  try { id = localStorage.getItem(K); } catch(e) {}
  if (!id) {
    const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = [...b].map(x => x.toString(16).padStart(2,"0")).join("");
    id = `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
    try { localStorage.setItem(K, id); } catch(e) {}
  }
  return id;
}

}

/* ============ SOUND & FX ============ */
let actx = null;
function beep(type){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {good:[523,659,784], bad:[220,180], tap:[440], win:[523,659,784,1047]}[type] || [440];
    seq.forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i*0.08;
      o.type = type==="bad" ? "sawtooth" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.16);
    });
  } catch(e) {}
  try { navigator.vibrate && navigator.vibrate(type==="bad" ? [40,40,40] : 15); } catch(e) {}
}
function floatXP(n, el){
  const r = (el || screen).getBoundingClientRect();
  const d = document.createElement("div"); d.className = "floatxp"; d.textContent = `+${n} XP`;
  d.style.left = Math.min(innerWidth-110, Math.max(10, r.left + r.width/2 - 40)) + "px"; d.style.top = (r.top + 10) + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function confetti(ms=2600){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), dpr = devicePixelRatio || 1; c.width = innerWidth*dpr; c.height = innerHeight*dpr;
  const cols = ["#c6f432","#ff6b5b","#5bc8ff","#ffd23f","#b9a7ff","#15132b"];
  const ps = Array.from({length:150}, () => ({x:Math.random()*c.width, y:-Math.random()*c.height*.6, w:(6+Math.random()*8)*dpr, h:(4+Math.random()*5)*dpr,
    vy:(2+Math.random()*4)*dpr, vx:(Math.random()-.5)*3*dpr, a:Math.random()*6, va:(Math.random()-.5)*.3, c:cols[Math.random()*cols.length|0]}));
  const t0 = performance.now();
  (function f(t){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if (t - t0 < ms) requestAnimationFrame(f); else c.remove(); })(t0);
}

/* ---- Level 3: Flags (swipe) ---- */
function playFlags(){
  if (S.step >= FLAGS.length) return finishLevel();
  const [txt] = FLAGS[S.step]; const nextTxt = FLAGS[S.step+1]?.[0];
  screen.innerHTML = `<section class="stack pop">
    ${dots(FLAGS.length, S.step)}
    <div class="deck" id="deck">
      ${nextTxt ? `<div class="swipe behind" aria-hidden="true"><span class="eyebrow">Kartu ${S.step+2}</span><p class="txt">${esc(nextTxt)}</p><span></span></div>` : ""}
      <div class="swipe" id="card" tabindex="0" aria-label="Kartu: ${esc(txt)}">
        <span class="stamp g">GREEN</span><span class="stamp r">RED</span>
        <span class="eyebrow">Kartu ${S.step+1} / ${FLAGS.length}</span>
        <p class="txt">${esc(txt)}</p>
        <span class="muted tiny">← Red Flag · geser · Green Flag →</span>
      </div>
    </div>
    <div class="swipebtns"><button class="btn red" id="r">🚩 Red Flag</button><button class="btn green" id="g">✅ Green Flag</button></div>
    <div id="fb"></div>
  </section>`;
  const card = $("#card"); let x0 = null, dx = 0, decided = false;
  const decide = (green) => {
    if (decided) return; decided = true;
    const [, isGreen, why] = FLAGS[S.step]; const ok = green === isGreen;
    card.style.transition = "transform .35s, opacity .35s";
    card.style.transform = `translateX(${green ? 140 : -140}%) rotate(${green ? 18 : -18}deg)`; card.style.opacity = "0";
    if (ok) S.scores.flags += award(10, $("#deck")); else miss();
    $("#r").disabled = $("#g").disabled = true;
    $("#fb").innerHTML = `<div class="fb ${ok?"good":"bad"} pop"><b>${isGreen ? "Green Flag ✅" : "Red Flag 🚩"}</b>${ok ? " · betul!" : " · kurang tepat."} ${esc(why)}</div>
      <button class="btn block" id="n" style="margin-top:12px">${S.step+1 < FLAGS.length ? "Kartu berikutnya →" : "Selesai level →"}</button>`;
    $("#n").onclick = () => { S.step++; save(); playFlags(); }; $("#n").focus();
  };
  card.addEventListener("pointerdown", e => { if (decided) return; x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (x0 === null) return; dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    card.querySelector(".stamp.g").style.opacity = Math.max(0, dx/90); card.querySelector(".stamp.r").style.opacity = Math.max(0, -dx/90);
  });
  const end = () => { if (x0 === null) return; x0 = null;
    if (Math.abs(dx) > 90) decide(dx > 0);
    else { card.style.transition = "transform .25s"; card.style.transform = ""; card.querySelectorAll(".stamp").forEach(s => s.style.opacity = 0); }
    dx = 0; };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
  card.addEventListener("keydown", e => { if (e.key === "ArrowRight") decide(true); if (e.key === "ArrowLeft") decide(false); });
  $("#g").onclick = () => decide(true); $("#r").onclick = () => decide(false);
}

/* ---- Level 4: Tuckman ---- */
function playTuck(){
  if (S.step === 0) return tuckOrder();
  if (S.step - 1 >= TUCK_Q.length) return finishLevel();
  const [quote, ans] = TUCK_Q[S.step - 1];
  screen.innerHTML = `<section class="stack pop">
    ${dots(TUCK_Q.length, S.step - 1)}

    <div class="opts">${TUCK.map((t,i) => `<button class="opt" data-id="${t.id}"><span class="k">${i+1}</span><span><b>${t.name}</b> <span class="muted tiny">${esc(t.desc)}</span></span></button>`).join("")}</div>
    <div id="fb"></div></section>`;
  let locked = false;
  screen.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (locked) return; locked = true; const ok = b.dataset.id === ans;
    screen.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (o.dataset.id === ans) o.classList.add("ok"); });
    if (!ok) { b.classList.add("no"); miss(); } else S.scores.tuck += award(15, b);
    $("#fb").innerHTML = `<div class="fb ${ok?"good":"bad"} pop"><b>${ok?"Nice!":"Hampir!"}</b> Ini tahap <b>${TUCK.find(t=>t.id===ans).name}</b>: ${esc(TUCK.find(t=>t.id===ans).desc)}</div>
      <button class="btn block" id="n" style="margin-top:12px">${S.step < TUCK_Q.length ? "Berikutnya →" : "Selesai level →"}</button>`;
    $("#n").onclick = () => { S.step++; save(); playTuck(); };
  });
}
function tuckOrder(){
  const pool = TUCK.map(t => t.id).sort((a,b) => (a.charCodeAt(1)*7 % 11) - (b.charCodeAt(1)*7 % 11));
  let picked = []; let mistakes = 0;
  const draw = () => {
    screen.innerHTML = `<section class="stack pop">
      <p class="eyebrow">Bagian 1 · Susun urutan tahapnya</p>
      <p class="q">Tap tahap sesuai urutan, dari awal tim terbentuk sampai berpisah.</p>
      <div class="chips">${pool.map(id => { const t = TUCK.find(x=>x.id===id); const done = picked.includes(id);
        return `<button class="chip ${done?"done":""}" data-id="${id}" ${done?"disabled":""}>${t.name}</button>`; }).join("")}</div>
      <div class="slots">${TUCK.map((t,i) => `<div class="slot ${picked[i]?"filled":""}"><span class="n">${i+1}</span>
        <span>${picked[i] ? `${t.name}<small>${esc(t.desc)}</small>` : '<span class="muted">…</span>'}</span></div>`).join("")}</div>
      <div id="fb"></div></section>`;
    screen.querySelectorAll(".chip:not(.done)").forEach(c => c.onclick = () => {
      const want = TUCK[picked.length].id;
      if (c.dataset.id === want) { picked.push(want); beep("tap"); draw(); if (picked.length === TUCK.length) doneOrder(); }
      else { mistakes++; c.classList.add("shake"); beep("bad"); S.combo = 0; drawBar(); setTimeout(() => c.classList.remove("shake"), 400); }
    });
  };
  const doneOrder = () => {
    const pts = Math.max(10, 50 - mistakes*10); S.scores.tuck += award(pts, $(".slots"));
    $("#fb").innerHTML = `<div class="fb good pop"><b>Urutan lengkap!</b> Kontrak belajar biasanya disusun di tahap <b>Norming</b>. Semakin cepat norma disepakati, semakin cepat kelas sampai di <b>Performing</b>.</div>
      <button class="btn block" id="n" style="margin-top:12px">Lanjut ke bagian 2 →</button>`;
    $("#n").onclick = () => { S.step = 1; save(); playTuck(); };
  };
  draw();
}

function playCommit(){

  </section>

  </section>
  <button class="btn block" id="mk">Cetak Kartu Komitmenku ✨</button>`;
  const upd = () => { $("#cnt").textContent = `${S.norms.length} / 3 dipilih`; };
  upd();
  $("#customNorm").oninput = (e) => { S.custom = e.target.value; save(); };
  screen.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const n = c.dataset.i === "custom" ? "__custom" : NORMS[+c.dataset.i];
    setTimeout(() => { $("#customWrap").hidden = !S.norms.includes("__custom"); if (n === "__custom" && S.norms.includes(n)) $("#customNorm").focus(); });
    if (S.norms.includes(n)) S.norms = S.norms.filter(x => x !== n);
    else if (S.norms.length < 3) S.norms.push(n);
    else { c.classList.add("shake"); setTimeout(() => c.classList.remove("shake"), 400); return; }
    beep("tap"); c.classList.toggle("on", S.norms.includes(n)); c.setAttribute("aria-pressed", S.norms.includes(n)); upd(); save();
  });

    S.sent = false;

    S.scores.commit = 100; S.xp += 100; floatXP(100, $("#mk")); if (!S.badges.includes("commit")) S.badges.push("commit");
    S.done = true; S.lvl = LEVELS.length; save(); beep("win"); go("final");
  };
}

  x.fillStyle = "#15132b"; x.fillRect(0,0,W,H);

  const box = (X,Y,w,h,fill,r=36) => { x.fillStyle = "#000"; rr(X+10,Y+10,w,h,r); x.fill(); x.fillStyle = fill; rr(X,Y,w,h,r); x.fill(); x.lineWidth = 6; x.strokeStyle = "#000"; rr(X,Y,w,h,r); x.stroke(); };
  function rr(X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
  const wrap = (t, X, Y, maxW, lh, font, color) => { x.font = font; x.fillStyle = color; const words = t.split(" "); let line = ""; let y = Y;

  x.font = `800 74px ${D}`; x.fillText(A.name, 110, 400);

  x.fillStyle = "#15132b"; x.font = `800 28px ${M}`; x.fillText("NORMA YANG AKU JAGA", 110, 600);
  myNorms().forEach((n,i) => { const y = 670 + i*84; x.fillStyle = ["#c6f432","#5bc8ff","#ffd23f"][i]; x.beginPath(); x.arc(130, y-14, 26, 0, 7); x.fill();
    x.lineWidth = 4; x.strokeStyle = "#000"; x.stroke(); x.fillStyle = "#15132b"; x.font = `800 30px ${M}`; x.fillText(String(i+1), 121, y-3);
    let fs = 40; do { x.font = `700 ${fs}px ${B}`; fs -= 2; } while (x.measureText(n).width > 800 && fs > 24); x.fillText(n, 180, y); });

  x.fillStyle = "#bdb8e3"; x.font = `500 24px ${B}`;

  if (!S.room || state === "needcode") {

      <form id="roomForm" class="row"><input class="input" id="room2" maxlength="5" placeholder="Kode kelas" autocomplete="off" style="text-transform:uppercase; letter-spacing:.2em; font-family:var(--mono)" value="${esc(S.room)}">
      <button class="btn" type="submit">Kirim</button></form><div id="sendErr"></div>`;
    const inp = $("#room2"); inp.oninput = () => { inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); };
    $("#roomForm").onsubmit = async (e) => {
      e.preventDefault(); if (!inp.value) return;
      try { const info = await api("kq_room_info", {p_code:inp.value}); S.room = info.code; S.roomTitle = info.title; save(); trySend(); }
      catch(err) { $("#sendErr").innerHTML = `<div class="fb bad">${esc(err.message)}</div>`; }
    };
    return;
  }
  if (state === "sending") { box.innerHTML = `<h3>Mengirim ke papan kelas…</h3>`; return; }
  box.innerHTML = `<h3>Belum terkirim</h3><div class="fb bad">${esc(state || "Gagal mengirim.")}</div>
    <div class="row"><button class="btn" id="retry" type="button">Coba kirim lagi</button><button class="btn alt" id="chg" type="button">Ganti kode kelas</button></div>`;
  $("#retry").onclick = () => trySend(); $("#chg").onclick = () => drawSend("needcode");
}
async function trySend(){
  drawSend("sending");
  try { await sendNorms(); beep("good"); drawSend(); }
  catch(e) { S.sent = false; save(); drawSend(e.message); }
}

/* ---- Facilitator board (word cloud) ---- */
let board = {code:"", timer:null, data:null, sig:"", moderate:false, showPromises:false, words:new Map()};
function openBoard(code){ board.code = code.toUpperCase(); history.replaceState(null, "", `${baseUrl()}?papan=${board.code}`); go("board"); }
const CLOUD_COLORS = ["#c6f432","#ff6b5b","#5bc8ff","#ffd23f","#b9a7ff","#7cf0c0","#ff9ad5","#ffffff"];
function boardScreen(){
  document.body.classList.add("wide"); $("#bar").hidden = true; $("#lvldots").hidden = true;
  const code = board.code; const token = getToken(code);
  const joinUrl = `${baseUrl()}?kelas=${code}`;

      <div class="bjoin"><div><small>Buka</small><b class="burl">${esc(joinUrl.replace(/^https?:\/\//,""))}</b><small>Kode kelas</small><b class="bcode">${esc(code)}</b></div>
        <div id="qr" class="qr" aria-label="Kode QR untuk bergabung"></div></div>
    </header>
    <div class="bgrid">
      <div class="cloudwrap"><div class="cloud" id="cloud" aria-live="polite"></div>
        <div class="bstat"><span id="bTotal">0</span> peserta mengirim · <span id="bOpen"></span>${board.moderate ? ' · <b style="color:var(--coral)">MODE MODERASI: klik kata untuk menyembunyikan</b>' : ""}</div></div>
      <aside class="bside">
        <div class="bpanel"><h3>Kandidat kontrak belajar</h3><ol class="top3" id="top3"></ol></div>
        <div class="bpanel"><h3>Karakter belajar kelas</h3><div class="bars" id="archBars"></div></div>
        <div class="bpanel" id="promPanel" ${board.showPromises ? "" : "hidden"}><h3>Janji peserta</h3><ul class="proms" id="proms"></ul></div>
      </aside>
    </div>
    <div class="bctl">
      ${token ? `<button class="btn alt" id="bToggle">Tutup pengisian</button>
        <button class="btn alt" id="bMod">${board.moderate ? "Selesai moderasi" : "Moderasi kata"}</button>
        <button class="btn alt" id="bUnhide">Tampilkan kata tersembunyi</button>
        <button class="btn alt" id="bReset">Reset jawaban</button>` : `<span class="tiny" style="color:#bdb8e3">Mode lihat saja. Buka papan dari perangkat pembuat kelas, atau pakai tautan kendali, untuk mengatur.</span>`}
      <button class="btn alt" id="bProm">${board.showPromises ? "Sembunyikan janji" : "Tampilkan janji"}</button>
      <button class="btn alt" id="bCopy">Salin tautan peserta</button>
      ${token ? `<button class="btn alt" id="bAdmin">Salin tautan kendali</button>` : ""}
      <button class="btn alt" id="bFull">Layar penuh</button>
      <button class="btn alt" id="bBack">Keluar</button>
    </div>
    <div id="bMsg"></div>
  </section>`;
  board.words = new Map(); board.sig = "";
  try { const qr = qrcode(0, "M"); qr.addData(joinUrl); qr.make(); $("#qr").innerHTML = qr.createSvgTag({cellSize:4, margin:0, scalable:true}); } catch(e) { $("#qr").hidden = true; }
  const msg = (t, bad) => { $("#bMsg").innerHTML = t ? `<div class="fb ${bad?"bad":"good"}" style="margin-top:10px">${esc(t)}</div>` : ""; if (t) setTimeout(() => { const m = $("#bMsg"); if (m) m.innerHTML = ""; }, 4000); };
  const copy = async (text, label) => { try { await navigator.clipboard.writeText(text); msg(label + " disalin."); } catch(e) { msg(text); } };
  const admin = async (action, arg) => { try { await api("kq_admin", {p_code:code, p_token:token, p_action:action, p_arg:arg ?? null}); pollBoard(); } catch(e) { msg(e.message, true); } };
  $("#bCopy").onclick = () => copy(joinUrl, "Tautan peserta");

  $("#bProm").onclick = () => { board.showPromises = !board.showPromises; boardScreen(); };
  $("#bBack").onclick = () => { stopBoard(); history.replaceState(null, "", baseUrl()); document.body.classList.remove("wide"); go("guide"); };
  $("#bFull").onclick = async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch(e) {} };
  if (token) {

  stopBoard(); pollBoard(); board.timer = setInterval(() => { if (document.visibilityState === "visible") pollBoard(); }, 3000);

function stopBoard(){ clearInterval(board.timer); board.timer = null; }
async function pollBoard(){
  if (S.screen !== "board") return stopBoard();
  let d; try { d = await api("kq_results", {p_code:board.code}); } catch(e) {
    if (board.data) return;   // gangguan sesaat: tetap tampilkan data terakhir
    const notFound = /tidak ditemukan/i.test(e.message);
    if ($("#bTitle")) $("#bTitle").textContent = notFound ? "Kode kelas tidak ditemukan" : "Gagal memuat papan";
    const c = $("#cloud");
    if (c) c.innerHTML = notFound
      ? `<p class="cloud-empty">Kode <b>${esc(board.code)}</b> belum terdaftar.<br><small>Kode kelas selalu 5 huruf/angka. Buat kelas baru lewat Panduan fasilitator, atau klik Keluar lalu buka papan dengan kode yang benar.</small></p>`
      : `<p class="cloud-empty">${esc(e.message)}<br><small>Papan akan mencoba lagi otomatis setiap 3 detik.</small></p>`;
    if (notFound) { stopBoard(); const j = document.querySelector(".bjoin"); if (j) j.hidden = true; }
    return;
  }
  board.data = d; const sig = JSON.stringify(d); if (sig === board.sig) return; board.sig = sig;
  if (!$("#cloud")) return;
  $("#bTitle").textContent = d.title; $("#bTotal").textContent = d.total;
  $("#bOpen").innerHTML = d.is_open ? '<span style="color:var(--lime)">pengisian dibuka</span>' : '<span style="color:var(--coral)">pengisian ditutup</span>';
  if ($("#bToggle")) $("#bToggle").textContent = d.is_open ? "Tutup pengisian" : "Buka pengisian";
  drawCloud(d.norms, d.total);
  const max = d.total || 1;
  $("#top3").innerHTML = d.norms.slice(0,3).map((n,i) => `<li><span class="t3n" style="background:${CLOUD_COLORS[i]}">${i+1}</span>
    <div class="t3b"><b>${esc(n.text)}</b><div class="t3bar"><i style="width:${n.count/max*100}%; background:${CLOUD_COLORS[i]}"></i></div>
    <small>${n.count} dari ${d.total} peserta (${Math.round(n.count/max*100)}%)</small></div></li>`).join("") || '<li class="tiny" style="color:#bdb8e3">Menunggu jawaban peserta…</li>';
  const at = Object.values(d.arch || {}).reduce((a,b) => a+b, 0) || 1;
  $("#archBars").innerHTML = Object.keys(ARCH).map(k => `<div class="barrow"><span>${esc(ARCH[k].name.replace("Si ",""))}</span>
    <div><i style="width:${(d.arch?.[k]||0)/at*100}%; background:${ARCH[k].hex}"></i></div><span>${d.arch?.[k]||0}</span></div>`).join("");
  if ($("#proms")) $("#proms").innerHTML = d.promises.map(p => `<li>“${esc(p)}”</li>`).join("") || '<li style="color:#bdb8e3">Belum ada.</li>';
}
function drawCloud(norms, total){
  const box = $("#cloud");
  if (!norms.length) { box.innerHTML = `<p class="cloud-empty">Menunggu peserta mengirim Kartu Komitmen…<br><small>Norma yang paling banyak dipilih akan tampil paling besar.</small></p>`; board.words = new Map(); return; }
  if (box.querySelector(".cloud-empty")) box.innerHTML = "";
  const counts = norms.map(n => n.count); const hi = Math.max(...counts), lo = Math.min(...counts);
  const wide = box.clientWidth > 700; const minF = wide ? 20 : 15, maxF = wide ? 66 : 40;
  // susun: kata terbesar di tengah, berselang-seling ke kiri dan kanan
  const arranged = []; norms.forEach((n,i) => { if (i % 2 === 0) arranged.push(n); else arranged.unshift(n); });
  const seen = new Set();
  arranged.forEach((n) => {
    const rank = norms.indexOf(n);
    const size = hi === lo ? (minF + maxF) / 2.2 : minF + (maxF - minF) * Math.pow((n.count - lo) / (hi - lo), 0.8);
    let el = board.words.get(n.key);
    if (!el) { el = document.createElement("span"); el.className = "word pop"; el.dataset.text = n.key; board.words.set(n.key, el); }
    el.textContent = n.text; el.title = `${n.count} peserta`;
    el.style.fontSize = size.toFixed(1) + "px"; el.style.color = CLOUD_COLORS[rank % CLOUD_COLORS.length];
    el.style.fontWeight = rank < 3 ? 800 : 600; el.style.opacity = rank < 3 ? 1 : .88;
    box.appendChild(el); seen.add(n.key);
  });
  for (const [k, el] of board.words) if (!seen.has(k)) { el.remove(); board.words.delete(k); }
}

})();
